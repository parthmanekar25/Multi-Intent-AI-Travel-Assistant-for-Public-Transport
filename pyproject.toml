[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "singapore-transport-agent"
version = "0.2.0"
description = "Modular LangGraph agent for Singapore public transport queries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "groq>=0.11.0",
  "requests>=2.32.0",
  "httpx>=0.27.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.0",
  "cachetools>=5.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
sg-transport = "scripts.simulate:main"

[tool.setuptools.packages.find]
include = ["singapore_transport*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
